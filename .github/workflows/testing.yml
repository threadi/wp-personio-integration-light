name: Testing

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check composer.json and composer.lock
        run: composer validate --strict --no-check-publish --no-check-version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Prepare generated files
        # PHPStan needs the constants of this file, the placeholders are enough for that.
        run: cp inc/constants_urls.php.dist inc/constants_urls.php

      - name: Run PHPStan check
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run WordPress Coding Standard checks
        run: vendor/bin/phpcs .

      - name: PHP Compatibility check
        run: vendor/bin/phpcs -p app --standard=PHPCompatibilityWP --runtime-set testVersion 8.2- --ignore=*/Crypt.php

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      # let the other PHP versions finish if one of them fails.
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
    services:
      database:
        # a fixed LTS version, so a new major release does not break the tests unnoticed.
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # wait until the server accepts connections before the steps start.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # set up PHP first, so composer resolves the dependencies for the PHP version under test.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpunit-polyfills:1.1
          extensions: mbstring, xml, zip, intl, pdo, mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # the tests load the plugin with its blocks, commands and styles.
      - name: Build blocks, commands and copy driver.js
        run: |
          npm ci
          npm run build
          npm run global-styles

      - name: Generate the URL constants
        run: |
          sed \
            -e 's#@@UrlLicense@@#https://laolaweb.com/wp-json/lwlicences/personio-integration/#' \
            -e 's#@@UrlUpdate@@#https://laolaweb.com/wp-json/lwreleases/personio-integration/#' \
            -e 's#@@UrlCosts@@#https://laolaweb.com/wp-json/lwlicences/personio-integration/costs#' \
            inc/constants_urls.php.dist > inc/constants_urls.php

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Setup tests
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Run tests
        run: composer test
